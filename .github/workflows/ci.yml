name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-sdk:
    name: Pi 1.5.0 / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install verified Pi stable SDK
        run: npm install --global --prefix "$RUNNER_TEMP/pi-sdk" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.0
      - name: Verify offline SDK compatibility
        run: node scripts/smoke-pi-sdk.mjs
        env:
          PI_SDK_PATH: ${{ runner.temp }}/pi-sdk/lib/node_modules/@earendil-works/pi-coding-agent

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Compile tests
        run: bun run compile-tests

      - name: Bundle extension
        run: bun esbuild.js

      - name: Bundle webview
        run: bun esbuild.webview.js

      - name: Run VS Code integration tests
        run: xvfb-run -a bun x vscode-test
